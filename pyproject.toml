[project]
name = "Bot-Character-Bots"
version = "0.1.0"
description = "Bot-Character-Bots"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-adapter-console>=0.10.0",
    "nonebot-adapter-mail>=1.0.0a7",
    "nonebot-adapter-telegram==0.1.0b20",
    "nonebot-plugin-status>=0.9.0",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.4",
    "nonebot-plugin-alconna>=0.62.0",
    "nonebot-plugin-filehost>=1.1.1",
    "nonebot-plugin-orm[postgresql]>=0.8.3",
    "asyncpg>=0.30",
"numpy>=1.26",
"faiss-cpu>=1.8",
    "nonebot-plugin-htmlkit>=0.1.0rc5",
    "jinja2>=3.1",
    "qrcode[pil]>=8.0",
    "nonebot_plugin_memes_api>=0.5.1",
    "nonebot-plugin-mcpclient>=0.1.2",
    "mcp>=1.0.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plugins*"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.nonebot]
plugin_dirs = ["plugins"]
builtin_plugins = ["echo"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
nonebot-adapter-console = [
    { name = "Console", module_name = "nonebot.adapters.console" }
]
nonebot-adapter-telegram = [
    { name = "Telegram", module_name = "nonebot.adapters.telegram" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-status = ["nonebot_plugin_status"]
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-localstore = ["nonebot_plugin_localstore"]
nonebot-plugin-alconna = ["nonebot_plugin_alconna"]
nonebot-plugin-filehost = ["nonebot_plugin_filehost"]
# ORM is kept as an optional dependency but is not auto-loaded; no project plugin uses its models.
nonebot-plugin-htmlkit = ["nonebot_plugin_htmlkit"]
# meme generation is owned by bot_unified_runtime; do not auto-load the external API plugin.
# MCP remains an optional dependency; do not auto-start stdio servers during NoneBot boot.

[tool.ruff]
extend-exclude = ["_crawlwiki_patch2"]
